<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launchpad · מרכז ניהול הקמה</title>
  <meta name="description" content="דמו: מרכז ניהול הקמת אתרים וסוכני AI, מנקודת המבט של מנהל פרויקט.">
  <meta name="theme-color" content="#FF3227">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="Launchpad · מרכז ניהול הקמה">
  <meta property="og:description" content="דמו: מרכז ניהול הקמת אתרים וסוכני AI, מנקודת המבט של מנהל פרויקט.">
  <meta property="og:url" content="https://launchpad-demo-sigma.vercel.app/">
  <meta property="og:image" content="https://launchpad-demo-sigma.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23FF3227'/%3E%3Cpath d='M16 7l2 6.5 6.5 1.5-6.5 1.8L16 23l-2-6.2L7.5 15l6.5-1.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">דילוג לתוכן</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" aria-label="Launchpad, מרכז ניהול">
        <span class="brand-mark">LAUNCHPAD</span>
        <span class="brand-sub">מרכז ניהול הקמה</span>
      </a>
      <nav class="nav" aria-label="ניווט ראשי">
        <a href="#/" data-screen="dashboard">מרכז ניהול</a>
        <a href="#/client" data-screen="client">תצוגת לקוח</a>
        <a href="#/spec" data-screen="spec">אפיון הכלי</a>
      </nav>
      <div class="top-actions">
        <button class="mode-badge" id="mode-badge" title="הגדרות AI">מצב דמו</button>
        <button class="icon-btn gear" id="settings-btn" aria-label="הגדרות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <div class="wrap foot-in">
      <span>דמו · כל הלקוחות, האנשים והנתונים בדויים.</span>
      <button class="link-btn" id="reset-demo">איפוס אישורים ושאלות של הדמו</button>
    </div>
  </footer>

  <div id="chat-root"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-top">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="icon-btn modal-close" aria-label="סגירה">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- סדר הטעינה חשוב: נתונים → כלים → לוגיקה → פרומפטים → AI → צ'אט → אפליקציה -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
